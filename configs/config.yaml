defaults:
  - model: llava_ov_7b
  - dataset: streamingbench
  - _self_
  - optional experiment: null

paths:
  # Null resolves to the repository containing scripts/run.py.
  repo_root: null
  output_root: results
  save_dir: null
  results_path: null

run:
  # infer: predictions only; evaluate: metrics only; full: both; validate: checks only
  mode: full
  num_chunks: 1
  sample_fps: 1.0
  # incremental uses sample_fps; uniform resets per question and uses source frames.
  frame_sampling: incremental
  uniform_num_frames: null
  # Variable-rate incremental sampling, e.g. "1.0:60,0.5:160,0.2" (fps:until_seconds, last open-ended).
  sample_schedule: null
  # Decode frames at this fraction of source resolution (1.0 = native); fewer visual tokens per frame.
  frame_scale: 1.0
  # Log per-question token retention per streamed frame (retention-<chunk>.jsonl).
  retention_snapshot: false
  # Offline pruning (uniform sampling): keep this fraction of visual tokens after encoding.
  offline_keep_ratio: 1.0
  # Compression token score: hermes (attention + recency), random, or recent.
  prune_score: hermes
  # Diagnostics (all off by default): real-question attention per frame (qattn-<chunk>.jsonl),
  # shift or drop Qwen3 timestamp text, start uniform frames later in the window.
  question_attention: false
  answer_attention: false
  blind: false
  oracle_window: false
  # Coverage-then-zoom (prune_score=zoom): windows JSON, extra frames in the windows, budget share.
  zoom_windows: null
  # Diagnostic: JSON list of [layer, head]; per-frame prompt attention after pruning (hrel-<chunk>.jsonl).
  relevance_heads: null
  # Relevance-guided importance sampling (needs relevance_heads and offline_keep_ratio < 1).
  relevance_zoom: false
  # Visual-attention rebalancing during answer generation (1.0 = off); layers 'all' or 'start-end'.
  # Contrastive decoding against a counterfactual memory: none | stamps | blind.
  contrastive_mode: none
  contrastive_alpha: 1.0
  contrastive_beta: 0.1
  # Tokens the contrast applies to: all | time | time+answer.
  contrastive_scope: all
  # Confidence-adaptive contrast strength: alpha * (1 - max p(. | real memory)).
  contrastive_adaptive: false
  visual_attention_gain: 1.0
  visual_attention_layers: all
  zoom_mix: 0.5
  zoom_temp: 1.0
  zoom_frames: 32
  zoom_share: 0.6
  shuffle_mode: none
  time_offset: 0.0
  drop_timestamps: false
  uniform_start_frac: 0.0
  kv_size: 6000
  debug: false
  encode_chunk_size: 16
  max_new_tokens: 256
  repetition_penalty: 1.1
  recency_weight_start: 0.75
  recency_weight_decay: 0.6
  reindex_margin: 1024
  use_history: true
  min_tokens_per_frame: 0
  frame_summary_strategy: mean
  frame_summary_temperature: 0.1
  # Qwen3 <t seconds> timestamp and vision start/end tokens: false (prune
  # normally), true (never prune) or surviving (keep while the group has a
  # visual token).
  keep_time_tokens: false
  token_trace_path: null
  verbose_token_trace: false
  keep_chunks: true
  # Optional explicit CUDA device IDs. Null respects the inherited device for one worker.
  devices: null

evaluation:
  debug: false
  num_tasks: 16

runtime:
  # Empty uses the interpreter that launched this runner.
  python: null
  dry_run: false
  capture_worker_logs: false
  capture_evaluation_logs: false

hydra:
  run:
    dir: .
  sweep:
    dir: outputs/hydra
    subdir: ${hydra.job.override_dirname}
  job:
    chdir: false
  output_subdir: null
