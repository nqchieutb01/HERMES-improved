# @package _global_

defaults:
  - override /model: llava_ov_7b
  - override /dataset: sember_mcq

dataset:
  question_categories:
    - time_duration
    - counting_objects_events
    - location_trace
  # Match the existing MCQ strategy experiments.
  max_videos: 100

run:
  mode: full
  num_chunks: 1
  frame_sampling: uniform
  uniform_num_frames: 128
  # Unused for selecting uniform frames, but required by the shared model API.
  sample_fps: 1.0
  kv_size: 6000
  encode_chunk_size: 16
  max_new_tokens: 16
  debug: false
  use_history: false
  min_tokens_per_frame: 0
  frame_summary_strategy: mean

paths:
  save_dir: results/${model.name}/${dataset.name}/uniform-n${run.uniform_num_frames}-time-count-location-v100

runtime:
  capture_worker_logs: true
  capture_evaluation_logs: true
