# @package _global_

defaults:
  - override /model: llava_ov_7b #llava_ov_0.5b
  - override /dataset: sember_grounding

dataset:
  question_categories:
    - time_duration
    - counting_objects_events
    - location_trace
  max_videos: 100
  # max_videos: null

run:
  mode: full
  num_chunks: 1
  sample_fps: 0.5
  kv_size: 6000
  encode_chunk_size: 16
  max_new_tokens: 128
  debug: false
  use_history: false
  min_tokens_per_frame: 1

# Sweep values belong here
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      run.sample_fps: "0.2"
      run.min_tokens_per_frame: "0"
      run.kv_size: "4000,6000,8000,10000"

paths:
  save_dir: results/${model.name}/${dataset.name}/time-count-location-fps${run.sample_fps}-kv${run.kv_size}-k${run.min_tokens_per_frame}

runtime:
  capture_worker_logs: true
  capture_evaluation_logs: true
